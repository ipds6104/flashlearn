<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0F766E" />
    <meta name="description" content="FlashLearn - Active Recall Platform: Materi, Kuis, & 3D Flashcards" />
    <title>⚡ FlashLearn</title>

    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Path to Hash Redirector for Shareable Links (/c/:id, /content/:id, /workspace/:id) -->
    <script>
      (function() {
        var p = window.location.pathname;
        var h = window.location.hash;
        if (!h || h === '#/' || h === '') {
          var cMatch = p.match(/^\/c\/([a-zA-Z0-9-]+)/);
          if (cMatch) {
            window.location.replace('/#/content/' + cMatch[1]);
            return;
          }
          var contentMatch = p.match(/^\/content\/([a-zA-Z0-9-]+)/);
          if (contentMatch) {
            window.location.replace('/#/content/' + contentMatch[1]);
            return;
          }
          var wsMatch = p.match(/^\/workspace\/([a-zA-Z0-9-]+)/);
          if (wsMatch) {
            window.location.replace('/#/workspace/' + wsMatch[1]);
            return;
          }
        }
      })();
    </script>

    <!-- Google Identity Services (GIS) for Google OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
